<!doctype html>
<html lang="pt-BR" id="top">
  <head>
    <meta charset="utf-8" />
    <title>Breno Queiroz — Portfolio</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050806" />
    <script>
      (() => {
        const storageKey = "bqtech-theme";
        const fallbackTheme = "dark";

        try {
          const storedTheme = localStorage.getItem(storageKey);
          const theme = storedTheme === "light" || storedTheme === "dark"
            ? storedTheme
            : fallbackTheme;

          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute("content", theme === "light" ? "#f4f7f2" : "#050806");
        } catch {
          document.documentElement.dataset.theme = fallbackTheme;
          document.documentElement.style.colorScheme = fallbackTheme;
        }
      })();
    </script>
    <meta
      name="description"
      content="Web design, desenvolvimento full-stack e evolução contínua."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62.5..125,100..900&amp;family=Space+Grotesk:wght@300..700&amp;family=Space+Mono:wght@400;700&amp;display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
