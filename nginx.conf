server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Prerendered route documents (e.g. /projetos/garage/index.html) are served
    # without a trailing-slash redirect; unknown paths fall back to the SPA shell.
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/index.html /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location ~* "-[A-Za-z0-9]{8,}\.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }
}
